<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Issues</title>
<link rel="stylesheet" href="design-system/spectrum.css">
<style>
.issues { max-width: 840px; margin: var(--spectrum-spacing-500) auto; padding: 0 var(--spectrum-spacing-300); }
.issues-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spectrum-spacing-300); }
.issues-filter { width: 320px; }
.issues-list { background: var(--spectrum-background-layer-2-color); border: var(--spectrum-border-width-100) solid var(--spectrum-gray-300); border-radius: var(--spectrum-corner-radius-200); }
.issues-head { display: flex; gap: var(--spectrum-spacing-300); padding: var(--spectrum-spacing-200) var(--spectrum-spacing-300); font-weight: var(--spectrum-bold-font-weight); color: var(--spectrum-neutral-content-color-default); background: var(--spectrum-background-layer-1-color); border-radius: var(--spectrum-corner-radius-200) var(--spectrum-corner-radius-200) 0 0; }
.issues-closed { color: var(--spectrum-neutral-subdued-content-color-default); font-weight: var(--spectrum-regular-font-weight); }
.issue { display: flex; justify-content: space-between; gap: var(--spectrum-spacing-200); padding: var(--spectrum-spacing-300); border-top: var(--spectrum-border-width-100) solid var(--spectrum-gray-300); }
.issue-title { display: flex; align-items: center; flex-wrap: wrap; gap: var(--spectrum-spacing-100); margin: 0 0 var(--spectrum-spacing-75); font-size: var(--spectrum-font-size-200); font-weight: var(--spectrum-bold-font-weight); color: var(--spectrum-neutral-content-color-default); }
.issue-labels { display: inline-flex; gap: var(--spectrum-spacing-75); }
.issue-meta { margin: 0; font-size: var(--spectrum-font-size-75); color: var(--spectrum-neutral-subdued-content-color-default); }
.issue-count { align-self: center; font-size: var(--spectrum-font-size-75); color: var(--spectrum-neutral-subdued-content-color-default); }
</style>
</head>
<body class="spectrum spectrum--light spectrum--medium">
<main class="issues" data-qa="issues">
  <div class="issues-bar" data-qa="bar">
    <div class="spectrum-Textfield issues-filter" data-qa="filter-wrap"><input class="spectrum-Textfield-input" id="filter" type="text" placeholder="Filter issues" data-qa="filter"></div>
    <button class="spectrum-Button spectrum-Button--fill spectrum-Button--accent" type="button" data-qa="btn-new"><span class="spectrum-Button-label" data-qa="btn-new-label">New issue</span></button>
  </div>
  <div class="issues-list" data-qa="list">
    <div class="issues-head" data-qa="head">
      <span data-qa="open-count">12 Open</span>
      <span class="issues-closed" data-qa="closed-count">48 Closed</span>
    </div>
    <div class="issue" data-qa="issue-1">
      <div data-qa="issue-1-main">
        <p class="issue-title" data-qa="issue-1-title"><span data-qa="issue-1-name">Search results ignore archived filter</span><span class="issue-labels" data-qa="issue-1-labels"><div class="spectrum-Badge spectrum-Badge--negative" data-qa="issue-1-bug"><div class="spectrum-Badge-label" data-qa="issue-1-bug-text">bug</div></div></span></p>
        <p class="issue-meta" data-qa="issue-1-meta">#482 opened 2 days ago by lena-m</p>
      </div>
      <span class="issue-count" data-qa="issue-1-count">5 comments</span>
    </div>
    <div class="issue" data-qa="issue-2">
      <div data-qa="issue-2-main">
        <p class="issue-title" data-qa="issue-2-title"><span data-qa="issue-2-name">Add keyboard shortcut for quick filters</span><span class="issue-labels" data-qa="issue-2-labels"><div class="spectrum-Badge spectrum-Badge--accent" data-qa="issue-2-enh"><div class="spectrum-Badge-label" data-qa="issue-2-enh-text">new</div></div><div class="spectrum-Badge spectrum-Badge--informative" data-qa="issue-2-triage"><div class="spectrum-Badge-label" data-qa="issue-2-triage-text">in progress</div></div></span></p>
        <p class="issue-meta" data-qa="issue-2-meta">#479 opened 4 days ago by sam-k</p>
      </div>
      <span class="issue-count" data-qa="issue-2-count">2 comments</span>
    </div>
    <div class="issue" data-qa="issue-3">
      <div data-qa="issue-3-main">
        <p class="issue-title" data-qa="issue-3-title"><span data-qa="issue-3-name">Docs: clarify token rotation steps</span><span class="issue-labels" data-qa="issue-3-labels"><div class="spectrum-Badge spectrum-Badge--neutral" data-qa="issue-3-docs"><div class="spectrum-Badge-label" data-qa="issue-3-docs-text">docs</div></div></span></p>
        <p class="issue-meta" data-qa="issue-3-meta">#471 opened last week by priya-r</p>
      </div>
      <span class="issue-count" data-qa="issue-3-count">0 comments</span>
    </div>
  </div>
</main>
</body>
</html>
