<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team members</title>
<link rel="stylesheet" href="design-system/spectrum.css">
<style>
.team { max-width: 760px; margin: var(--spectrum-spacing-600) auto; padding: 0 var(--spectrum-spacing-300); }
.team-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spectrum-spacing-300); }
.team-title { margin: 0; font-size: var(--spectrum-font-size-400); font-weight: var(--spectrum-bold-font-weight); }
.team-list { background: var(--spectrum-background-layer-2-color); border: var(--spectrum-border-width-100) solid var(--spectrum-gray-300); border-radius: var(--spectrum-corner-radius-200); }
.member { display: flex; align-items: center; gap: var(--spectrum-spacing-200); padding: var(--spectrum-spacing-200) var(--spectrum-spacing-300); border-top: var(--spectrum-border-width-100) solid var(--spectrum-gray-200); }
.member-first { border-top: 0; }
.member-avatar { flex: none; width: var(--spectrum-spacing-500); height: var(--spectrum-spacing-500); border-radius: var(--spectrum-corner-radius-800); background: var(--spectrum-gray-200); }
.member-main { flex: 1; }
.member-name { margin: 0; font-weight: var(--spectrum-bold-font-weight); color: var(--spectrum-neutral-content-color-default); }
.member-email { margin: 0; font-size: var(--spectrum-font-size-75); color: var(--spectrum-neutral-subdued-content-color-default); }
.member-role { margin-right: var(--spectrum-spacing-100); }
.team-note { margin-top: var(--spectrum-spacing-200); font-size: var(--spectrum-font-size-75); color: var(--spectrum-neutral-subdued-content-color-default); }
</style>
</head>
<body class="spectrum spectrum--light spectrum--medium">
<main class="team" data-qa="team">
  <div class="team-bar" data-qa="bar">
    <h1 class="team-title" data-qa="title">Team members</h1>
    <button class="spectrum-Button spectrum-Button--fill spectrum-Button--accent" type="button" data-qa="btn-invite"><span class="spectrum-Button-label" data-qa="btn-invite-label">Invite member</span></button>
  </div>
  <div class="team-list" data-qa="list">
    <div class="member member-first" data-qa="member-1">
      <span class="member-avatar" data-qa="avatar-1"></span>
      <div class="member-main" data-qa="main-1"><p class="member-name" data-qa="name-1">Jordan Lee</p><p class="member-email" data-qa="email-1">jordan@example.com</p></div>
      <div class="spectrum-Badge spectrum-Badge--neutral member-role" data-qa="role-1"><div class="spectrum-Badge-label" data-qa="role-1-text">Owner</div></div>
      <button class="spectrum-Button spectrum-Button--outline spectrum-Button--secondary spectrum-Button--sizeS" type="button" data-qa="btn-edit-1"><span class="spectrum-Button-label" data-qa="btn-edit-1-label">Edit</span></button>
    </div>
    <div class="member" data-qa="member-2">
      <span class="member-avatar" data-qa="avatar-2"></span>
      <div class="member-main" data-qa="main-2"><p class="member-name" data-qa="name-2">Priya Raman</p><p class="member-email" data-qa="email-2">priya@example.com</p></div>
      <div class="spectrum-Badge spectrum-Badge--neutral member-role" data-qa="role-2"><div class="spectrum-Badge-label" data-qa="role-2-text">Member</div></div>
      <button class="spectrum-Button spectrum-Button--outline spectrum-Button--negative spectrum-Button--sizeS" type="button" data-qa="btn-remove-2"><span class="spectrum-Button-label" data-qa="btn-remove-2-label">Remove</span></button>
    </div>
    <div class="member" data-qa="member-3">
      <span class="member-avatar" data-qa="avatar-3"></span>
      <div class="member-main" data-qa="main-3"><p class="member-name" data-qa="name-3">Sam Kowalski</p><p class="member-email" data-qa="email-3">sam@example.com</p></div>
      <div class="spectrum-StatusLight spectrum-StatusLight--sizeM spectrum-StatusLight--notice member-role" data-qa="role-3">Pending invite</div>
      <button class="spectrum-Button spectrum-Button--outline spectrum-Button--negative spectrum-Button--sizeS" type="button" data-qa="btn-remove-3"><span class="spectrum-Button-label" data-qa="btn-remove-3-label">Cancel invite</span></button>
    </div>
  </div>
  <p class="team-note" data-qa="note">Owners can change roles and billing.</p>
</main>
</body>
</html>
