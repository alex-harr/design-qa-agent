<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Billing summary</title>
<link rel="stylesheet" href="design-system/spectrum.css">
<style>
.billing { max-width: 720px; margin: var(--spectrum-spacing-600) auto; padding: 0 var(--spectrum-spacing-300); }
.billing-title { margin: 0 0 var(--spectrum-spacing-300); font-size: var(--spectrum-font-size-400); font-weight: var(--spectrum-bold-font-weight); }
.billing-alert { margin-bottom: var(--spectrum-spacing-300); }
.bill-table { width: 100%; }
.bill-amount { text-align: right; }
.bill-strong { font-weight: var(--spectrum-medium-font-weight); }
.bill-total { padding: var(--spectrum-spacing-300) 0; text-align: right; font-size: var(--spectrum-font-size-200); font-weight: var(--spectrum-bold-font-weight); color: var(--spectrum-neutral-content-color-default); }
.bill-actions { display: flex; justify-content: flex-end; gap: var(--spectrum-spacing-100); padding-top: var(--spectrum-spacing-300); border-top: var(--spectrum-border-width-100) solid var(--spectrum-gray-300); }
</style>
</head>
<body class="spectrum spectrum--light spectrum--medium">
<main class="billing" data-qa="billing">
  <h1 class="billing-title" data-qa="title">Billing summary</h1>
  <div class="spectrum-InLineAlert spectrum-InLineAlert--info billing-alert" data-qa="flash"><div class="spectrum-InLineAlert-content" data-qa="flash-text">Your next invoice is due on November 1.</div></div>
  <table class="spectrum-Table spectrum-Table--sizeM bill-table" data-qa="table">
    <thead class="spectrum-Table-head" data-qa="thead">
      <tr data-qa="head-row">
        <th class="spectrum-Table-headCell" data-qa="th-item">Item</th>
        <th class="spectrum-Table-headCell" data-qa="th-seats">Seats</th>
        <th class="spectrum-Table-headCell bill-amount" data-qa="th-amount">Amount</th>
      </tr>
    </thead>
    <tbody class="spectrum-Table-body" data-qa="tbody">
      <tr class="spectrum-Table-row" data-qa="row-plan">
        <td class="spectrum-Table-cell" data-qa="td-plan">Team plan</td>
        <td class="spectrum-Table-cell" data-qa="td-plan-seats">12</td>
        <td class="spectrum-Table-cell bill-amount bill-strong" data-qa="td-plan-amount">$96.00</td>
      </tr>
      <tr class="spectrum-Table-row" data-qa="row-storage">
        <td class="spectrum-Table-cell" data-qa="td-storage">Extra storage</td>
        <td class="spectrum-Table-cell" data-qa="td-storage-seats">n/a</td>
        <td class="spectrum-Table-cell bill-amount bill-strong" data-qa="td-storage-amount">$10.00</td>
      </tr>
    </tbody>
  </table>
  <div class="bill-total" data-qa="total">Total due: $106.00</div>
  <div class="bill-actions" data-qa="actions">
    <button class="spectrum-Button spectrum-Button--outline spectrum-Button--secondary" type="button" data-qa="btn-download"><span class="spectrum-Button-label" data-qa="btn-download-label">Download invoice</span></button>
    <button class="spectrum-Button spectrum-Button--fill spectrum-Button--accent" type="button" data-qa="btn-pay"><span class="spectrum-Button-label" data-qa="btn-pay-label">Pay now</span></button>
  </div>
</main>
</body>
</html>
