<!doctype html>
<html lang="en" data-color-mode="light" data-light-theme="light">
<head>
<meta charset="utf-8">
<title>Plans</title>
<link rel="stylesheet" href="design-system/primer.css">
<style>
.plans { max-width: 820px; margin: var(--base-size-48) auto; padding: 0 var(--base-size-16); text-align: center; }
.plans-title { margin: 0 0 var(--base-size-8); font-size: var(--text-title-size-large); font-weight: var(--text-title-weight-large); }
.plans-sub { margin: 0 0 var(--base-size-32); font-size: var(--text-body-size-large); color: var(--fgColor-muted); }
.plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--base-size-24); text-align: left; }
.plan { padding: var(--base-size-24); }
.plan-featured { border-color: var(--borderColor-accent-emphasis); border-width: var(--borderWidth-thick); }
.plan-name { margin: 0 0 var(--base-size-4); font-size: var(--text-title-size-small); font-weight: var(--text-title-weight-small); }
.plan-price { margin: 0 0 var(--base-size-16); font-size: var(--text-title-size-large); font-weight: var(--base-text-weight-semibold); color: var(--fgColor-default); }
.plan-per { font-size: var(--text-body-size-medium); font-weight: var(--base-text-weight-normal); color: var(--fgColor-muted); }
.plan-list { margin: 0 0 var(--base-size-24); padding-left: var(--base-size-20); color: var(--fgColor-default); }
.plan-item { margin-bottom: var(--base-size-8); }
.plan-cta { width: 100%; }
.plan-badge { margin-left: var(--base-size-8); }
</style>
</head>
<body>
<main class="plans" data-qa="plans">
  <h1 class="plans-title" data-qa="title">Choose a plan</h1>
  <p class="plans-sub" data-qa="subtitle">Upgrade or downgrade any time.</p>
  <div class="plan-grid" data-qa="grid">
    <section class="Box plan" data-qa="plan-free">
      <h2 class="plan-name" data-qa="name-free">Free</h2>
      <p class="plan-price" data-qa="price-free">$0 <span class="plan-per" data-qa="per-free">per user / month</span></p>
      <ul class="plan-list" data-qa="list-free">
        <li class="plan-item" data-qa="item-free-1">Unlimited public projects</li>
        <li class="plan-item" data-qa="item-free-2">Community support</li>
      </ul>
      <button class="btn plan-cta" type="button" data-qa="cta-free">Current plan</button>
    </section>
    <section class="Box plan plan-featured" data-qa="plan-team">
      <h2 class="plan-name" data-qa="name-team">Team <span class="Label Label--accent plan-badge" data-qa="badge-team">Popular</span></h2>
      <p class="plan-price" data-qa="price-team">$8 <span class="plan-per" data-qa="per-team">per user / month</span></p>
      <ul class="plan-list" data-qa="list-team">
        <li class="plan-item" data-qa="item-team-1">Private projects</li>
        <li class="plan-item" data-qa="item-team-2">Protected branches</li>
      </ul>
      <button class="btn btn-primary plan-cta" type="button" data-qa="cta-team">Upgrade to Team</button>
    </section>
  </div>
</main>
</body>
</html>
