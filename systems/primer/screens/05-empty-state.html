<!doctype html>
<html lang="en" data-color-mode="light" data-light-theme="light">
<head>
<meta charset="utf-8">
<title>Projects</title>
<link rel="stylesheet" href="design-system/primer.css">
<style>
.projects { max-width: 720px; margin: var(--base-size-40) auto; padding: 0 var(--base-size-16); }
.projects-title { margin: 0 0 var(--base-size-16); font-size: var(--text-title-size-medium); font-weight: var(--text-title-weight-medium); }
.empty { padding: var(--base-size-48) var(--base-size-32); text-align: center; }
.empty-icon { display: inline-block; width: var(--base-size-48); height: var(--base-size-48); margin-bottom: var(--base-size-16); border-radius: var(--borderRadius-large); background: var(--bgColor-accent-muted); border: var(--borderWidth-thin) solid var(--borderColor-accent-muted); }
.empty-heading { margin: 0 0 var(--base-size-8); font-size: var(--text-title-size-medium); font-weight: var(--text-title-weight-medium); color: var(--fgColor-default); }
.empty-body { max-width: 420px; margin: 0 auto var(--base-size-24); font-size: var(--text-body-size-large); color: var(--fgColor-muted); }
.empty-actions { display: flex; justify-content: center; gap: var(--base-size-12); }
.empty-link { color: var(--fgColor-accent); }
.empty-note { margin-top: var(--base-size-16); font-size: var(--text-body-size-small); color: var(--fgColor-muted); }
</style>
</head>
<body>
<main class="projects" data-qa="projects">
  <h1 class="projects-title" data-qa="title">Projects</h1>
  <div class="Box empty" data-qa="empty">
    <span class="empty-icon" data-qa="icon"></span>
    <h2 class="empty-heading" data-qa="heading">No projects yet</h2>
    <p class="empty-body" data-qa="body">Projects group issues and pull requests so your team can plan work in one place.</p>
    <div class="empty-actions" data-qa="actions">
      <button class="btn btn-primary" type="button" data-qa="btn-new">New project</button>
      <a class="btn btn-invisible empty-link" href="#" data-qa="link-learn">Learn about projects</a>
    </div>
    <p class="empty-note" data-qa="note">Templates are available on the Team plan.</p>
  </div>
</main>
</body>
</html>
